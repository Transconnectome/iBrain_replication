name: Mirror to lab org
on:
  push:
    branches: ['**']
    tags: ['**']
  delete:
jobs:
  mirror:
    if: github.repository == 'kyuhyunglee/iBrain_replication'
    runs-on: ubuntu-latest
    steps:
      - name: Mirror
        run: |
          git clone --mirror https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git src
          cd src
          git push --mirror https://x-access-token:${{ secrets.MIRROR_TOKEN }}@github.com/<연구실-org>/iBrain_replication.git
