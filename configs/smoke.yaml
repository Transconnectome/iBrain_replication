# First real-data run on the lab server: paper model, batch and loaders on a small slice of the real data.
# Checks that the readers, 256 windows per step cut into token_budget micro-batches in bf16 (U33, U36), checkpoints and
# the 1:1 alternation work before paper.yaml. pretrain.sbatch first checks the budget's largest micro-batches on the GPU.
#   sbatch --time=02:00:00 --job-name=ibrain-smoke scripts/slurm/pretrain.sbatch configs/smoke.yaml 0 runs/smoke_s0
# Before 2026-10-08 the head had no BN (U7); the smoke run with that head is the baseline of the collapse ablation.
model: {d: 256, H: 8, ffn: 1024, L: 6, S: 10, P_spike: 5, P_ieeg: 50, p: 0.1, d_proj: 128, head_bn: true, head_bn_group: 32}  # U7: SimSiam head with BN per 32 windows
pretrain:
  steps: 200           # 100 spike + 100 iEEG optimizer steps
  epochs: null
  warmup: 20           # below steps, so the cosine decay is exercised (U20, U33)
  batch_size: 256      # same as paper.yaml (U33, U36, U37)
  grad_accum: 1
  token_budget: 2048
  precision: bf16
  grad_checkpoint: false
  compile: true        # U40: torch.compile of encoders, decoders and backbone blocks
  ckpt_every: 50
  num_workers: 4
  shuffle_buffer: 1024
  open_blocks: 8         # iEEG blocks each DataLoader worker mixes at once; a batch comes from one worker (U41)
data:
  spike:
    format: pile_mmap    # converted copy (U30); same rows as format pile with the same max_rows and seed
    root: /pscratch/sd/z/zres0710/iBrain/cache/neural-pile-primate-mmap
    split: train
    exclude_sources: []
    max_rows: 200      # seeded random subset of pile rows
  ieeg:
    - {format: ajile12, root: /pscratch/sd/z/zres0710/iBrain/pretrain/iEEG/AJILE12/000055, max_hours: 0.5}
    - {format: swec, root: /pscratch/sd/z/zres0710/iBrain/pretrain/iEEG/SWEC/data, max_hours: 0.5}
